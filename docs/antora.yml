name: feelpp-core
title: Template Project
version: ~
start_page: index.adoc
asciidoc:
  attributes:
    project_name: Feelpp Core
    numbered: true
    dynamic-blocks@: ''
    allow-uri-read: true
    hide-uri-scheme: true
    feelpp: Feel++
    stem: latexmath
    python: Python
    cpp: C++
ext:
  collector:
    - run:
        command: ./generate-jupyter.sh docs/modules/ROOT
      scan:
        dir: jupyter/
        files: '**/*.ipynb'
        base: modules/ROOT/attachments/
nav:
- modules/ROOT/nav.adoc

