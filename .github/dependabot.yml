# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "daily"
    # Keep the documentation stack on Asciidoctor 2 until Antora supports newer versions.
    ignore:
      - dependency-name: "@asciidoctor/core"
        versions: [">=3.0.0"]
      - dependency-name: "asciidoctor"
        versions: [">=3.0.0"]
      # Kroki 1 requires Asciidoctor 4; retain the Antora-compatible 0.x line.
      - dependency-name: "asciidoctor-kroki"
        versions: [">=1.0.0"]
  - package-ecosystem: "github-actions" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "daily"
