---
name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '*'
  #    types: [opened, reopened]
  release:
    types: [published]

jobs:

  licensing:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check SPDX and licence texts
        run: |
          python -m pip install reuse==6.2.0
          reuse lint

  build_wheel:
    runs-on: self-feelpp
    name: Build wheel
    if: "!contains(github.event.head_commit.message, 'wheel skip')"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true
          submodules: 'recursive'
          clean: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python/Node Env
        run: |
          uv venv --system-site-packages
          source .venv/bin/activate
          uv pip install -r pyproject.toml --extra dev --extra test
          npm install --verbose
          npx downdoc README.adoc

      - name: Build wheel
        run: |
          source .venv/bin/activate
          uv build
          uv pip install dist/*.whl

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          # Artifact name
          name: artifacts-wheel
          # Directory containing files to upload
          path: dist/*.whl


  build_docs:
    runs-on: self-feelpp
    name: Build Antora Site
    needs: build_wheel
    if: "!contains(github.event.head_commit.message, 'docs skip')"
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          submodules: 'recursive'
          clean: true

      - name: Download Wheels
        uses: actions/download-artifact@v8
        with:
          name: artifacts-wheel
          path: dist/

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python deps
        run: |
          uv venv --system-site-packages
          source .venv/bin/activate
          uv pip install dist/*.whl

      - name: Build Antora site
        run: |
          source .venv/bin/activate
          npm install --verbose
          npm run antora || true
          npm run antora
        env:
          GIRDER_API_KEY: ${{ secrets.GIRDER }}

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/master'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: public

  build_code:
    runs-on: self-feelpp
    name: Build, Install, Package code
    if: "!contains(github.event.head_commit.message, 'code skip')"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true
          submodules: 'recursive'
          clean: true

      - name: Build
        run: |
          cmake --preset x86_64-linux
          cmake --build --preset x86_64-linux

      - name: Check
        run: |
          ctest --preset default
        env:
          OMPI_ALLOW_RUN_AS_ROOT: 1
          OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1

      - name: Package
        run: |
          cmake --build --preset x86_64-linux -t package

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          # Artifact name
          name: feelpp-core-artifacts
          # Directory containing files to upload
          path: build/x86_64-linux/assets/feelpp-core-*

  build-wasm:
    if: "!contains(github.event.head_commit.message, 'wasm skip')"
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: self-feelpp, jobs: 10, preset: wasm32-linux, allow-failure: false}
          - {os: self-feelpp, jobs: 10, preset: wasm64-linux, allow-failure: false}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow-failure }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true
          submodules: 'recursive'
      - name: Build
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }}

  deliver:
    runs-on: self-feelpp
    needs: build_code
    name: Build docker, tag and push
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          submodules: 'recursive'
      - name: Download
        uses: actions/download-artifact@v8
        with:
          # Artifact name
          name: feelpp-core-artifacts
          path: artifacts/

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/feelpp/feelpp-core
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' || github.event_name == 'release'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}

      - name: Build container image
        uses: docker/build-push-action@v7
        with:
          context: artifacts
          push: ${{ github.event_name == 'push' || github.event_name == 'release' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          file: ./Dockerfile

      - name: Delete untagged containers
        if: github.event_name == 'push' || github.event_name == 'release'
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'feelpp-core'
          package-type: 'container'
          min-versions-to-keep: 4
          delete-only-untagged-versions: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}

  release:
    runs-on: self-feelpp
    name: Release
    needs: [build_wheel, build_code]
    if: startsWith(github.ref ,'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          submodules: 'recursive'
      - name: Download Deb Packages
        uses: actions/download-artifact@v8
        with:
          # Artifact name
          name: feelpp-core-artifacts
          path: artifacts/
      - name: Download Wheel Packages
        uses: actions/download-artifact@v8
        with:
          # Artifact name
          name: wheel-artifacts
          path: dist/
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.deb
            dist/*.whl
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') ||
                          contains(github.ref, 'beta') ||
                          contains(github.ref, 'rc')}}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          tag_name: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
